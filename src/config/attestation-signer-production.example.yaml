# Production interface scaffold. The signer remains unready while required
# checks are unimplemented and currently rejects RotateKey in production_enforce;
# use staging-kms plus an explicit test overlay for rotation tests.
signing:
  attestationSigner:
    profile: production-kms
    instances:
      - id: signer-0
      - id: signer-1
      - id: signer-2
      - id: signer-3
      - id: signer-4
    productionPolicy:
      protocolInstanceId: "0x<32-byte-hex>"
      bridgeNamespaceId: "0x<20-byte-hex>"
      activeBridgeKeyHash: "0x<20-byte-hex>"
      supportedSigningPolicyVersions: [1]
      verifierRegistryFile: configs/verifier-registry.toml
      teeAllowedSignerIds:
        - "<33-byte-compressed-secp256k1-pubkey>"
      sourceSetFile: configs/source-set.toml
      envelope:
        allowedProofTriples: "scroll_batch:scroll-production-v1:<vk-hash>"
        allowedTeeSignerIds: []
        maxProofArtifacts: 4
        maxRefStringBytes: 512
        maxFetchUrlBytes: 2048
      allowedReleaseVersion: "<immutable-release-version>"
      allowedGitCommit: "<build-git-commit>"
      allowedSigningPolicyVersion: 1

bridge:
  # Bootstrap-only M-of-N cohort. After RotateKey, current state is on-chain.
  initialAttestationKeyset:
    signerIds: [signer-0, signer-1, signer-2]
    threshold: 2

images:
  services:
    attestationSigner:
      repository: dogeos69/attestation-signer
      tag: v0.3.0
      pullPolicy: IfNotPresent

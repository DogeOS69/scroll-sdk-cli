# DogeOS Minimal Deployment Specification
# This is a minimal example that relies on generator defaults where possible.
# See deployment-spec.example.yaml for full options.

version: "1.0"

metadata:
  name: dogeos-devnet
  environment: devnet

infrastructure:
  provider: aws
  aws:
    region: us-west-2
    accountId: "123456789012"
    eksClusterName: dogeos-devnet-cluster
  namespace: default
  sequencerCount: 1
  bootnodeCount: 1
  # Configure Reth identities in doge-config.toml with setup l2-sequencer-reth / l2-bootnode-reth.

network:
  l1ChainName: "DOGE"
  l2ChainName: "DogeOS Devnet"
  l1ChainId: 111111
  l2ChainId: 221122
  tokenSymbol: DOGE

database:
  admin:
    host: localhost
    port: 5432
    username: postgres
    password: "$ENV:DB_ADMIN_PASSWORD"
    database: postgres
    vpcHost: localhost
    vpcPort: 5432

accounts:
  # Deployment/activity accounts: setup gen-keystore. Service signers: setup eth-da-submitter / setup fee-oracle.
  owner:
    address: "$ENV:OWNER_ADDRESS"

dogecoin:
  network: testnet
  # Optional: synthetic L1 starts using real Dogecoin block parents at this height.
  # If omitted, generated values derive it as dogecoin.indexerStartHeight + 1.
  # l1GenesisBlock: 8208200
  externalRpc:
    url: "https://dogecoin.testnet.dogeos.com"
    username: "$ENV:DOGECOIN_EXTERNAL_RPC_USERNAME"
    password: "$ENV:DOGECOIN_EXTERNAL_RPC_PASSWORD"
  clusterRpc:
    username: "$ENV:DOGECOIN_CLUSTER_RPC_USERNAME"
    password: "$ENV:DOGECOIN_CLUSTER_RPC_PASSWORD"
  walletPath: ".data/doge-wallet.json"

ethereumDa:
  chain: devnet
  chainId: 32382
  l1RpcUrl: "http://l1-devnet:8545"
  beaconRpcUrl: "http://l1-devnet-lighthouse:5052"
  confirmationDepth: 1
  finalizationDepth: 1
  minFinality: safe

bridge:
  seedString: "dogeos-devnet-v1"
  thresholds:
    attestation: 1
    recovery: 1
  keyCounts:
    attestation: 1
    recovery: 1
  initialAttestationKeyset:
    signerIds: [signer-0]
    threshold: 1
  # Optional compressed/uncompressed SEC1 TEE public key. The CLI validates it
  # and writes dogeos-core's canonical compressed representation.
  # teePubkey: "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"
  timelock: 100
  feeRateSatsPerKvb: 1000000
  targetAmountsSats:
    sequencer: 100000000       # 1 DOGE
    feeWallet: 100000000       # 1 DOGE
    bridge: 1000000000         # 10 DOGE
  confirmationsRequired: 1
  fees:
    depositFeeSats: "10000"
    withdrawalFeeWei: "100000000000000"
    minWithdrawalAmountWei: "1000000000000000"
  feeRecipient: "0x0000000000000000000000000000000000000000"

signing:
  # CubeSigner provides the single TEE key. Roles are populated by `scrollsdk setup cubesigner-init`.
  # Production policy evidence can be added later under
  # signing.cubesigner.productionPolicy; generated production values remain
  # fail-closed while those reviewed fields are absent.
  cubesigner: {}
  # Attestation signers are partner-operated docker-compose services. After
  # generating this deployment, collect descriptors/*.json and run:
  #   scrollsdk setup attestation-signer --threshold <T>
  # Each partner hands over the descriptor generated by `scrollsdk signer init`.
  # Current dogeos-core requires canonical protocol context in every mode, so
  # runtime preflight occurs after the post-genesis signer bundle is installed.

frontend:
  protocol: https
  baseDomain: scrollsdk
  externalUrls:
    l1Rpc: "https://sochain.com/DOGETEST"
    l1Explorer: "https://sochain.com/DOGETEST"
  subdomains:
    frontend: portal
    rpcGateway: rpc
    blockscout: blockscout
    grafana: grafana

rollup:
  coordinator:
    chunkCollectionTimeSec: 30    # Faster for devnet
    batchCollectionTimeSec: 60
    bundleCollectionTimeSec: 180

contracts:
  deploymentSalt: "dogeos-devnet-v1"
  gasOracle:
    blobScalar: 1
    commitScalar: 38720000000
    scalar: 1
    penaltyThreshold: 100
    penaltyFactor: 10

genesis:
  maxEthSupplyWei: "100000000000000000000000000000"
  deployerInitialBalanceWei: "1000000000000000000000000"
  baseFeePerGasWei: 1000000000

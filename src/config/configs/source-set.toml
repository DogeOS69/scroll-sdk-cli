[dogecoin]
rpcs = ["https://dogecoin-rpc-a.example", "https://dogecoin-rpc-b.example"]
min_online_sources = 2
all_online_must_agree = true
required_confirmations = 20
fail_on_anchor_disagreement = true

[ethereum_execution]
rpcs = ["https://ethereum-rpc-a.example", "https://ethereum-rpc-b.example"]

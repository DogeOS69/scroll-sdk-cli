# Test fixture for DeploymentSpec validation and configuration generation.
# Tests replace environment references and infrastructure inputs before use.
# Operator templates live in scroll-sdk/examples; this is not a deployment starter.

version: "1.0"

metadata:
  name: dogeos-devnet
  environment: devnet

infrastructure:
  provider: aws
  aws:
    region: us-west-2
    accountId: "123456789012"
    eksClusterName: dogeos-devnet-cluster
  namespace: default
  sequencerCount: 1
  bootnodeCount: 1
  # Use `setup gen-keystore --from-spec deployment-spec.yaml` to prepare Reth identities in doge-config.

# Public bootnode P2P stays disabled until selected nodes have approved source CIDRs.
# See docs/spec-bootnode-public-p2p.md for activation inputs.
bootnodePublicP2p: []

network:
  l1ChainName: "DOGE"
  l2ChainName: "DogeOS Devnet"
  l2ChainId: 221122
  tokenSymbol: DOGE

database:
  admin:
    host: localhost
    port: 5432
    username: postgres
    password: "$ENV:DB_ADMIN_PASSWORD"
    database: postgres
    vpcHost: localhost
    vpcPort: 5432

accounts:
  # Deployment/activity accounts: setup gen-keystore.
  # Service signers: setup gen-keystore --service <eth-da-submitter|fee-oracle>.
  owner:
    # Use a wallet/multisig you can sign with; deployment does not prove control.
    address: "$ENV:OWNER_ADDRESS"

dogecoin:
  # L1 chain ID is derived from this network; do not specify network.l1ChainId.
  network: testnet
  # Optional: synthetic L1 starts using real Dogecoin block parents at this height.
  # If omitted, generated values derive it as dogecoin.indexerStartHeight + 1.
  # l1GenesisBlock: 8208200
  externalRpc:
    url: "https://dogecoin.testnet.dogeos.com"
    username: "$ENV:DOGECOIN_EXTERNAL_RPC_USERNAME"
    password: "$ENV:DOGECOIN_EXTERNAL_RPC_PASSWORD"
  clusterRpc:
    username: "$ENV:DOGECOIN_CLUSTER_RPC_USERNAME"
    password: "$ENV:DOGECOIN_CLUSTER_RPC_PASSWORD"
  walletPath: ".data/doge-wallet.json"

ethereumDa:
  # Pending blob transactions default to 8 for Ethereum DA mainnet, otherwise 10.
  # The DA chain below selects the default, not metadata.environment.
  # Optional override: publish: {maxPendingBlobTxs: 10}
  chain: devnet
  chainId: 32382
  l1RpcUrl: "http://l1-devnet:8545"
  beaconRpcUrl: "http://l1-devnet-lighthouse:5052"
  confirmationDepth: 1
  finalizationDepth: 1

bridge:
  seedString: "dogeos-devnet-v1"
  thresholds:
    attestation: 1
    recovery: 1
  keyCounts:
    attestation: 1
    recovery: 1
  initialAttestationKeyset:
    signerIds: [signer-0]
    threshold: 1
  # Optional compressed/uncompressed SEC1 TEE public key. The CLI validates it
  # and writes dogeos-core's canonical compressed representation.
  # teePubkey: "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"
  timelock: 100
  feeRateSatsPerKvb: 1000000
  targetAmountsSats:
    sequencer: 42069000        # Fixed WF sequencer output: 0.42069 DOGE
    feeWallet: 100000000       # 1 DOGE
    bridge: 1000000000         # 10 DOGE
  confirmationsRequired: 1
  fees:
    depositFeeSats: "100000000" # 1 DOGE (Dogecoin uses 8 decimals)
    withdrawalFeeWei: "100000000000000000" # 0.1 DOGE (L2 uses 18 decimals)
    minWithdrawalAmountWei: "1000000000000000000" # 1 DOGE
  feeRecipient: "0x0000000000000000000000000000000000000000"

signing:
  # CubeSigner provides the single TEE key. Roles are populated by `scrollsdk setup cubesigner-init`.
  # This devnet example starts in observe mode. Mainnet deployments
  # must select production_verifier_key_policy and supply policyReceipts.
  cubesigner:
    mode: transport_only
  # Attestation signers are partner-operated services. For the spec workflow,
  # declare their public identities in top-level attestationSigners entries:
  # {name: signer-0, attestationPubkey: <compressed key>, transportPubkey: <compressed key>}.
  # Repeat for every signer selected by bridge.initialAttestationKeyset.signerIds.
  # See scroll-sdk/examples/deployment-spec.example.yaml for the production form.
  # The independent manual workflow can still import partner descriptors with
  # `scrollsdk setup attestation-signer --threshold <T>` before bridge-init.
  # Current dogeos-core requires canonical protocol context in every mode, so
  # runtime preflight occurs after the post-genesis signer bundle is installed.

# Use dry_run explicitly for a configuration-only fee-oracle rehearsal.
feeOracle:
  contractWriteMode: live

frontend:
  protocol: https
  baseDomain: scrollsdk
  externalUrls:
    l1Rpc: "https://sochain.com/DOGETEST"
    l1Explorer: "https://sochain.com/DOGETEST"
  subdomains:
    frontend: portal
    rpcGateway: rpc
    blockscout: blockscout
    grafana: grafana

contracts:
  # Dogecoin P2PKH recipient of fee-vault withdrawals, not an EVM address.
  feeVaultDogeRecipientAddress: REPLACE_WITH_DOGECOIN_P2PKH_ADDRESS
  l2BaseFeeOverheadWei: "420000000000"
  deploymentSalt: "dogeos-devnet-v1"
  gasOracle:
    blobScalar: 7400000000
    commitScalar: 600000000
    scalar: 938846
    penaltyFactor: 10000

genesis:
  gasLimit: 30000000
  maxEthSupplyWei: "226156424291633194186662080095093570025917938800079226639565593765455331328"
  # 10 native DOGE; matches scroll-contracts/docker/templates/config.toml.
  deployerInitialBalanceWei: "10000000000000000000"
  baseFeePerGasWei: 100000000

# Enable after filling SLACK_WEBHOOK_URL in private deployment.env.
monitoring:
  slack:
    enabled: false

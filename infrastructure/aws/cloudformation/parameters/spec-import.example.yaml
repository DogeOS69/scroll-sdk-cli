# Copy to your private environment directory; replace stack names.
# Stack names are explicit: the importer never searches or creates resources.
# This layout uses one stack per template in this directory.
version: 1
sources:
  # signing-key.yaml, one stack per identity.
  - kind: signing-key
    stack: REPLACE-key-eth-da
    identity: ethDaSubmitter
  - kind: signing-key
    stack: REPLACE-key-fee-oracle
    identity: feeOracle
  - kind: signing-key
    stack: REPLACE-key-sequencer-0
    identity: sequencer
    index: 0            # Identifies the spec index, not the array position.
  - kind: signing-key
    stack: REPLACE-key-sequencer-1
    identity: sequencer
    index: 1
  - kind: signing-key
    stack: REPLACE-key-bridge
    identity: bridge
  # application-roles.yaml
  - kind: workload-access
    stack: REPLACE-application-roles
  # https-alb.yaml, one stack per ALB.
  - kind: alb
    stack: REPLACE-public-alb
    endpoint: public
  - kind: alb
    stack: REPLACE-tso-alb
    endpoint: tso
  - kind: alb
    stack: REPLACE-proof-alb
    endpoint: proof
  # http-target.yaml, one stack per backend service.
  - kind: http-target
    stack: REPLACE-rpc-http-target
    binding: l2-reth-rpc-public
  - kind: http-target
    stack: REPLACE-rpc-ws-target
    binding: l2-reth-rpc-public-ws
  - kind: http-target
    stack: REPLACE-portal-target
    binding: frontends
  - kind: http-target
    stack: REPLACE-blockscout-api-target
    binding: blockscout-api
  - kind: http-target
    stack: REPLACE-blockscout-frontend-target
    binding: blockscout-frontend
  - kind: http-target
    stack: REPLACE-tso-target
    binding: tso-service
  - kind: http-target
    stack: REPLACE-proof-target
    binding: proof-coordinator
  # proof-secret.yaml
  - kind: secret-metadata
    stack: REPLACE-proof-secret
# Optional sources: enable only for services selected in your spec.
# - kind: bootnode-nlb             # bootnode-nlb.yaml
#   stack: REPLACE-bootnode-0
#   index: 0
# - kind: capacity-access          # dstack-role.yaml
#   stack: REPLACE-dstack-role
# - kind: capacity-alb             # https-alb.yaml, internal dstack edge
#   stack: REPLACE-dstack-alb
# - kind: capacity-target          # http-target.yaml for the dstack controller
#   stack: REPLACE-dstack-target
# - kind: secrets-reader           # secrets-reader-role.yaml
#   stack: REPLACE-dedicated-secrets-reader
# For offline import replace `stack` with `file`, relative to this manifest:
# - kind: workload-access
#   file: outputs/application-roles.outputs.json
#
# Stacks adopted with a CloudFormation import may group resources differently.
# A stack with the five *KeyArn outputs uses `signing-identities`; a stack with
# several resources of one kind uses `prefix` to select one of them:
# - kind: signing-identities
#   stack: REPLACE-signing-identities
# - kind: http-target
#   stack: REPLACE-public-edge
#   binding: frontends
#   prefix: Portal                 # reads PortalTargetGroupArn
# - kind: bootnode-nlb
#   stack: REPLACE-p2p-network
#   index: 1
#   prefix: Bootnode1              # reads Bootnode1TargetGroupArn and Bootnode1SecurityGroupId

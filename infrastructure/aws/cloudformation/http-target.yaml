AWSTemplateFormatVersion: '2010-09-09'
Description: One HTTP/IP target group and host/path listener rule. Creates no ALB and registers no targets.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  ListenerArn:
    Type: String
    Description: Existing HTTPS443 ALB listener ARN.
    AllowedPattern: arn:aws[a-z-]*:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:listener/app/[A-Za-z0-9-]+/[a-f0-9]+/[a-f0-9]+
  Hostname:
    Type: String
    Description: Exact hostname covered by the ALB certificate.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  ServiceKind:
    Type: String
    Description: tso uses only /health, /signer and /signer/*. generic uses PathPatterns.
    AllowedValues:
    - tso
    - generic
    Default: tso
  PathPatterns:
    Type: CommaDelimitedList
    Default: /*
    Description: Generic routes only; 1-3 ALB path patterns matching the rendered ingress.
  ListenerPriority:
    Type: Number
    MinValue: 1
    MaxValue: 50000
    Description: Unique on this listener. Narrow routes must precede broader overlapping routes.
  BackendPort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
  HealthCheckPath:
    Type: String
    Description: Must match the rendered application values.
    AllowedPattern: /.*
    Default: /health
  HealthSuccessCodes:
    Type: String
    Description: Must match the rendered application ALB success-codes.
    AllowedPattern: '[0-9,-]+'
    Default: '200'
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
Resources:
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: VpcId
      Protocol: HTTP
      Port:
        Ref: BackendPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath:
        Ref: HealthCheckPath
      Matcher:
        HttpCode:
          Ref: HealthSuccessCodes
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: target-group
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-TargetGroup
  Route:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: ListenerArn
      Priority:
        Ref: ListenerPriority
      Conditions:
      - Field: host-header
        HostHeaderConfig:
          Values:
          - Ref: Hostname
      - Field: path-pattern
        PathPatternConfig:
          Values:
            Fn::If:
            - IsTso
            - - /health
              - /signer
              - /signer/*
            - Ref: PathPatterns
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: TargetGroup
Outputs:
  TargetGroupArn:
    Description: Bind exactly one Kubernetes Service through TargetGroupBinding.
    Value:
      Ref: TargetGroup
Conditions:
  IsTso:
    Fn::Equals:
    - Ref: ServiceKind
    - tso

AWSTemplateFormatVersion: '2010-09-09'
Description: Dstack Pod Identity / optional IRSA controller for private AWS workers in one region and two approved subnets. Creates no workers.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  OidcIssuer:
    Type: String
    Description: EKS issuer WITHOUT https://, for an existing IAM OIDC provider.
    AllowedPattern: ^$|oidc\.eks\.[a-z0-9-]+\.amazonaws\.com(?:\.cn)?/id/[A-Za-z0-9]+
    Default: ''
  Namespace:
    Type: String
    Description: Kubernetes namespace used by the Helm releases.
    AllowedPattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?'
    Default: default
  PermissionsBoundaryArn:
    Type: String
    Description: Optional existing IAM permissions boundary ARN.
    AllowedPattern: ^$|arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+
    Default: ''
  ServiceAccount:
    Type: String
    Description: Must match the rendered Kubernetes ServiceAccount name.
    AllowedPattern: '[a-z0-9]([-a-z0-9.]*[a-z0-9])?'
    Default: dstack-controller
  Project:
    Type: String
    Description: Exact dstack project; used to scope worker ownership tags.
    AllowedPattern: '[a-zA-Z0-9_-]+'
  VpcId:
    Type: AWS::EC2::VPC::Id
  WorkerSubnetA:
    Type: AWS::EC2::Subnet::Id
  WorkerSubnetB:
    Type: AWS::EC2::Subnet::Id
  WorkerInstanceProfileArn:
    Type: String
    Description: Optional existing EC2 instance profile ARN.
    AllowedPattern: ^$|arn:aws[a-z-]*:iam::[0-9]{12}:instance-profile/[A-Za-z0-9+=,.@_/-]+
    Default: ''
  WorkerRoleArn:
    Type: String
    Description: Role in the optional worker instance profile.
    AllowedPattern: ^$|arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+
    Default: ''
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
  WorkerSubnetC:
    Type: String
    Default: ''
    AllowedPattern: ^$|subnet-[a-f0-9]+
    Description: Optional third existing worker subnet; include when dstack can select three AZs.
  WorkloadIdentity:
    Type: String
    Default: pod-identity
    AllowedValues:
    - pod-identity
    - irsa
    Description: Pod Identity for new environments; explicitly select irsa for an existing OIDC deployment.
  ClusterName:
    Type: String
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]*'
    Description: Existing EKS cluster. Required for Pod Identity; install its agent separately.
    MinLength: 1
Resources:
  ControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::If:
        - UsePodIdentity
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
            - sts:AssumeRole
            - sts:TagSession
            Condition:
              StringEquals:
                aws:RequestTag/eks-cluster-arn:
                  Fn::Sub: arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
                aws:RequestTag/kubernetes-namespace:
                  Ref: Namespace
                aws:RequestTag/kubernetes-service-account:
                  Ref: ServiceAccount
        - Fn::Sub: |-
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${OidcIssuer}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OidcIssuer}:aud": "sts.amazonaws.com",
                      "${OidcIssuer}:sub": "system:serviceaccount:${Namespace}:${ServiceAccount}"
                    }
                  }
                }
              ]
            }
      PermissionsBoundary:
        Fn::If:
        - HasBoundary
        - Ref: PermissionsBoundaryArn
        - Ref: AWS::NoValue
      Policies:
      - PolicyName: workload-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:DescribeAvailabilityZones
            - ec2:DescribeImages
            - ec2:DescribeInstances
            - ec2:DescribeInstanceAttribute
            - ec2:DescribeInstanceTypes
            - ec2:DescribeInstanceTypeOfferings
            - ec2:DescribeSecurityGroups
            - ec2:DescribeSubnets
            - ec2:DescribeVpcs
            - ec2:DescribeRouteTables
            - ec2:DescribeVolumes
            - ec2:DescribeSpotInstanceRequests
            - ec2:DescribeCapacityReservations
            - ec2:DescribeAddresses
            - ec2:DescribePlacementGroups
            - servicequotas:GetServiceQuota
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
            Sid: ReadWorkerCompute
          - Effect: Allow
            Action: ec2:RunInstances
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
                aws:RequestTag/owner: dstack
                aws:RequestTag/dstack_project:
                  Ref: Project
            Sid: LaunchTaggedWorkers
          - Effect: Allow
            Action: ec2:RunInstances
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}::image/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:key-pair/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:placement-group/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:capacity-reservation/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkerSubnetA}
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkerSubnetB}
            - Fn::If:
              - HasSubnetC
              - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkerSubnetC}
              - Ref: AWS::NoValue
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
            Sid: LaunchDependencies
          - Effect: Allow
            Action: ec2:CreateTags
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
                ec2:CreateAction:
                - RunInstances
                - CreateSecurityGroup
                - CreateVolume
            Sid: TagOnCreation
          - Effect: Allow
            Action:
            - ec2:TerminateInstances
            - ec2:DeleteSecurityGroup
            - ec2:AuthorizeSecurityGroupIngress
            - ec2:AuthorizeSecurityGroupEgress
            - ec2:DeleteVolume
            - ec2:AttachVolume
            - ec2:DetachVolume
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
                ec2:ResourceTag/owner: dstack
                ec2:ResourceTag/dstack_project:
                  Ref: Project
            Sid: ManageOwnedWorkers
          - Effect: Allow
            Action:
            - ec2:CreateSecurityGroup
            - ec2:CreateVolume
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
                aws:RequestTag/owner: dstack
                aws:RequestTag/dstack_project:
                  Ref: Project
            Sid: CreateTaggedResources
          - Effect: Allow
            Action: ec2:CreateSecurityGroup
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${VpcId}
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
            Sid: WorkerVpc
          - Effect: Allow
            Action:
            - ec2:CreatePlacementGroup
            - ec2:DeletePlacementGroup
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:placement-group/*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Ref: AWS::Region
            Sid: PlacementGroups
          - Fn::If:
            - HasWorkerProfile
            - Effect: Allow
              Action: iam:GetInstanceProfile
              Resource:
                Ref: WorkerInstanceProfileArn
            - Ref: AWS::NoValue
          - Fn::If:
            - HasWorkerRole
            - Effect: Allow
              Action: iam:PassRole
              Resource:
                Ref: WorkerRoleArn
              Condition:
                StringEquals:
                  iam:PassedToService: ec2.amazonaws.com
            - Ref: AWS::NoValue
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: controller-role
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-ControllerRole
      Description:
        Fn::Sub: DogeOS ${ResourceClassification} - ${Environment} - ControllerRole. Nonproduction resources may be deleted after testing.
  ControllerRoleAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    Condition: UsePodIdentity
    Properties:
      ClusterName:
        Ref: ClusterName
      Namespace:
        Ref: Namespace
      ServiceAccount:
        Ref: ServiceAccount
      RoleArn:
        Fn::GetAtt:
        - ControllerRole
        - Arn
      DisableSessionTags: false
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: controller-role
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-ControllerRole
Outputs:
  RoleArn:
    Description: Dstack controller IRSA role; fleet/backend config must use the same project, region and VPC.
    Value:
      Fn::GetAtt:
      - ControllerRole
      - Arn
  ControllerRoleAssociationId:
    Condition: UsePodIdentity
    Value:
      Fn::GetAtt:
      - ControllerRoleAssociation
      - AssociationId
Conditions:
  HasBoundary:
    Fn::Not:
    - Fn::Equals:
      - Ref: PermissionsBoundaryArn
      - ''
  HasWorkerProfile:
    Fn::Not:
    - Fn::Equals:
      - Ref: WorkerInstanceProfileArn
      - ''
  HasWorkerRole:
    Fn::Not:
    - Fn::Equals:
      - Ref: WorkerRoleArn
      - ''
  HasSubnetC:
    Fn::Not:
    - Fn::Equals:
      - Ref: WorkerSubnetC
      - ''
  UsePodIdentity:
    Fn::Equals:
    - Ref: WorkloadIdentity
    - pod-identity
Rules:
  ProfilePair:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::And:
          - Fn::Equals:
            - Ref: WorkerInstanceProfileArn
            - ''
          - Fn::Equals:
            - Ref: WorkerRoleArn
            - ''
        - Fn::And:
          - Fn::Not:
            - Fn::Equals:
              - Ref: WorkerInstanceProfileArn
              - ''
          - Fn::Not:
            - Fn::Equals:
              - Ref: WorkerRoleArn
              - ''
      AssertDescription: Supply both worker instance profile ARN and its role ARN, or neither.
  IdentityParameters:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::Equals:
          - Ref: WorkloadIdentity
          - pod-identity
        - Fn::Not:
          - Fn::Equals:
            - Ref: OidcIssuer
            - ''
      AssertDescription: IRSA requires OidcIssuer.

AWSTemplateFormatVersion: '2010-09-09'
Description: One independent bootnode TCP30303 NLB. References two existing EIPs; no nodes or EIPs are allocated.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
  EipAllocationA:
    Type: String
    Description: Existing unused EIP allocation in this region.
    AllowedPattern: eipalloc-[a-f0-9]+
  EipAllocationB:
    Type: String
    Description: Second existing unused EIP allocation.
    AllowedPattern: eipalloc-[a-f0-9]+
  PeerIpv4Cidr:
    Type: String
    Description: Approved peer range. Empty keeps the endpoint closed.
    AllowedPattern: ^$|(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[1-9]|[12][0-9]|3[0-2])
    Default: ''
  BackendIpv4Cidr:
    Type: String
    Description: VPC/Pod IPv4 range containing the designated bootnode.
    AllowedPattern: (?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: load-balancer-access
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-SecurityGroup
      GroupDescription:
        Fn::Sub: DogeOS ${ResourceClassification} ${Environment} TCP30303 peers
      VpcId:
        Ref: VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 30303
        ToPort: 30303
        CidrIp:
          Ref: BackendIpv4Cidr
        Description:
          Fn::Sub: ${Environment} ${ResourceClassification} backend traffic
  PeerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasPeer
    Properties:
      GroupId:
        Ref: SecurityGroup
      IpProtocol: tcp
      FromPort: 30303
      ToPort: 30303
      CidrIp:
        Ref: PeerIpv4Cidr
      Description:
        Fn::Sub: ${Environment} ${ResourceClassification} client ingress
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
      - Ref: SecurityGroup
      SubnetMappings:
      - SubnetId:
          Ref: SubnetA
        AllocationId:
          Ref: EipAllocationA
      - SubnetId:
          Ref: SubnetB
        AllocationId:
          Ref: EipAllocationB
      LoadBalancerAttributes:
      - Key: load_balancing.cross_zone.enabled
        Value: 'true'
      - Key: deletion_protection.enabled
        Value: 'true'
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: load-balancer
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-LoadBalancer
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: VpcId
      Protocol: TCP
      Port: 30303
      TargetType: ip
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port
      TargetGroupAttributes:
      - Key: proxy_protocol_v2.enabled
        Value: 'false'
      - Key: preserve_client_ip.enabled
        Value: 'false'
      - Key: load_balancing.cross_zone.enabled
        Value: 'true'
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: target-group
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-TargetGroup
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Protocol: TCP
      Port: 30303
      DefaultActions:
      - Type: forward
        TargetGroupArn:
          Ref: TargetGroup
Outputs:
  LoadBalancerArn:
    Description: One bootnode per NLB.
    Value:
      Ref: LoadBalancer
  TargetGroupArn:
    Description: bootnodePublicP2p[].existingNlb.targetGroupArn.
    Value:
      Ref: TargetGroup
  SecurityGroupId:
    Description: bootnodePublicP2p[].existingNlb.securityGroupIds entry.
    Value:
      Ref: SecurityGroup
  ListenerArn:
    Description: TCP30303 listener for read-only validation.
    Value:
      Ref: Listener
  DnsName:
    Description: NLB DNS name; public P2P endpoints use the allocated EIP addresses.
    Value:
      Fn::GetAtt:
      - LoadBalancer
      - DNSName
Conditions:
  HasPeer:
    Fn::Not:
    - Fn::Equals:
      - Ref: PeerIpv4Cidr
      - ''
Rules:
  DistinctPlacement:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: SubnetA
          - Ref: SubnetB
      AssertDescription: Select distinct subnets in different AZs.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: EipAllocationA
          - Ref: EipAllocationB
      AssertDescription: Select distinct existing EIP allocations.

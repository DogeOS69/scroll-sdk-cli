AWSTemplateFormatVersion: '2010-09-09'
Description: One durable DogeOS signing identity. Existing keys are adopted with a CloudFormation import, not referenced here.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  AliasName:
    Type: String
    Description: Stable alias/ prefixed name. Choose your own environment/purpose path; never use a rehearsal date or the reserved alias/aws/ prefix.
    AllowedPattern: '^alias/(?!aws/)[a-zA-Z0-9/_-]{1,250}$'
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
Resources:
  SigningKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description:
        Fn::Sub: DogeOS ${ResourceClassification} - ${Environment} - SigningKey. Nonproduction resources may be
          deleted after testing.
      KeySpec: ECC_SECG_P256K1
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: kms:*
          Resource: '*'
          Principal:
            AWS:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
          Sid: EnableAccountIAMPermissions
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: signing-key
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-SigningKey
  SigningAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName:
        Ref: AliasName
      TargetKeyId:
        Ref: SigningKey
Outputs:
  KeyArn:
    Description: Signing key ARN; verify its public identity before use.
    Value:
      Fn::GetAtt:
      - SigningKey
      - Arn

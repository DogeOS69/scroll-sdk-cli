AWSTemplateFormatVersion: '2010-09-09'
Description: EKS Pod Identity Agent for an existing cluster. Install once per cluster; do not adopt an existing add-on implicitly.
Parameters:
  Environment:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues: [production, nonproduction-deletable]
  ClusterName:
    Type: String
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]*'
  AddonVersion:
    Type: String
    Description: Explicit version compatible with the existing cluster Kubernetes version.
    AllowedPattern: 'v[0-9]+\.[0-9]+\.[0-9]+-eksbuild\.[0-9]+'
Resources:
  Agent:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName:
        Ref: ClusterName
      AddonName: eks-pod-identity-agent
      AddonVersion:
        Ref: AddonVersion
      ResolveConflicts: NONE
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Purpose
        Value: pod-identity-agent
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-pod-identity-agent
Outputs:
  AddonArn:
    Value:
      Fn::GetAtt: [Agent, Arn]

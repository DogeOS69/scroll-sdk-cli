AWSTemplateFormatVersion: '2010-09-09'
Description: One HTTPS ALB with fixed-404 default. Add reviewed routes separately; references existing VPC/subnets/ACM.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
  SubnetC:
    Type: String
    Default: ''
    AllowedPattern: ^$|subnet-(?:[0-9a-f]{8}|[0-9a-f]{17})
    Description: Optional third AZ subnet. Enable every AZ that can host backend Pods.
  Scheme:
    Type: String
    Description: Use internal for dstack.
    AllowedValues:
    - internal
    - internet-facing
    Default: internal
  CertificateArn:
    Type: String
    Description: Issued ACM certificate covering all routed hosts, in this account/region.
    AllowedPattern: arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+
  ClientIpv4Cidr:
    Type: String
    Description: Explicit allowed HTTPS client range; empty keeps the endpoint closed.
    AllowedPattern: ^$|(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])
    Default: ''
  BackendIpv4Cidr:
    Type: String
    Description: VPC/Pod IPv4 range reachable by this ALB.
    AllowedPattern: (?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])
  BackendPortFrom:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Lowest approved backend/health-check port.
  BackendPortTo:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Highest approved backend/health-check port.
  PrivateHostname:
    Type: String
    Description: Optional exact-host private Route53 zone for internal dstack only. Empty creates no DNS.
    AllowedPattern: ^$|[a-z0-9][a-z0-9.-]+\.[a-z]{2,}
    Default: ''
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: load-balancer-access
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-SecurityGroup
      GroupDescription:
        Fn::Sub: DogeOS ${ResourceClassification} ${Environment} HTTPS edge
      VpcId:
        Ref: VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort:
          Ref: BackendPortFrom
        ToPort:
          Ref: BackendPortTo
        CidrIp:
          Ref: BackendIpv4Cidr
        Description:
          Fn::Sub: ${Environment} ${ResourceClassification} backend traffic
  ClientIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasClient
    Properties:
      GroupId:
        Ref: SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp:
        Ref: ClientIpv4Cidr
      Description:
        Fn::Sub: ${Environment} ${ResourceClassification} client ingress
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme:
        Ref: Scheme
      IpAddressType: ipv4
      Subnets:
      - Ref: SubnetA
      - Ref: SubnetB
      - Fn::If:
        - HasSubnetC
        - Ref: SubnetC
        - Ref: AWS::NoValue
      SecurityGroups:
      - Ref: SecurityGroup
      LoadBalancerAttributes:
      - Key: idle_timeout.timeout_seconds
        Value: '120'
      - Key: deletion_protection.enabled
        Value: 'true'
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: load-balancer
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-LoadBalancer
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - CertificateArn:
          Ref: CertificateArn
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '404'
          ContentType: text/plain
          MessageBody: Not found
  PrivateZone:
    Type: AWS::Route53::HostedZone
    Condition: HasPrivateDns
    Properties:
      Name:
        Ref: PrivateHostname
      VPCs:
      - VPCId:
          Ref: VpcId
        VPCRegion:
          Ref: AWS::Region
  PrivateAlias:
    Type: AWS::Route53::RecordSet
    Condition: HasPrivateDns
    Properties:
      HostedZoneId:
        Ref: PrivateZone
      Name:
        Ref: PrivateHostname
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - LoadBalancer
          - DNSName
        HostedZoneId:
          Fn::GetAtt:
          - LoadBalancer
          - CanonicalHostedZoneID
        EvaluateTargetHealth: false
Outputs:
  PrivateUrl:
    Condition: HasPrivateDns
    Description: Certificate hostname for the private controller endpoint; never substitute the ALB DNS name.
    Value:
      Fn::Sub: 'https://${PrivateHostname}'
  LoadBalancerArn:
    Description: Existing-ALB endpoint ARN.
    Value:
      Ref: LoadBalancer
  ListenerArn:
    Description: Supply to http-target.yaml.
    Value:
      Ref: Listener
  SecurityGroupId:
    Description: Allow this SG to reach the backends; keep Kubernetes NetworkPolicy aligned.
    Value:
      Ref: SecurityGroup
  DnsName:
    Description: Public DNS remains externally managed.
    Value:
      Fn::GetAtt:
      - LoadBalancer
      - DNSName
  CanonicalHostedZoneId:
    Description: Alias target zone ID, not your application hosted zone.
    Value:
      Fn::GetAtt:
      - LoadBalancer
      - CanonicalHostedZoneID
Conditions:
  HasSubnetC:
    Fn::Not:
    - Fn::Equals:
      - Ref: SubnetC
      - ''
  HasClient:
    Fn::Not:
    - Fn::Equals:
      - Ref: ClientIpv4Cidr
      - ''
  HasPrivateDns:
    Fn::Not:
    - Fn::Equals:
      - Ref: PrivateHostname
      - ''
Rules:
  DistinctThirdSubnet:
    Assertions:
    - Assert:
        Fn::And:
        - Fn::Not:
          - Fn::Equals:
            - Ref: SubnetC
            - Ref: SubnetA
        - Fn::Not:
          - Fn::Equals:
            - Ref: SubnetC
            - Ref: SubnetB
      AssertDescription: Optional third subnet must differ from SubnetA and SubnetB.
  PrivateDnsOnly:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::Equals:
          - Ref: PrivateHostname
          - ''
        - Fn::Equals:
          - Ref: Scheme
          - internal
      AssertDescription: PrivateHostname requires internal scheme.
  DistinctSubnets:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: SubnetA
          - Ref: SubnetB
      AssertDescription: Select two distinct subnets in different AZs.

AWSTemplateFormatVersion: '2010-09-09'
Description: Deployment-scoped External Secrets IRSA reader. No secret values, creation or upload privileges.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  OidcIssuer:
    Type: String
    Description: EKS issuer WITHOUT https://, for an existing IAM OIDC provider.
    AllowedPattern: oidc\.eks\.[a-z0-9-]+\.amazonaws\.com(?:\.cn)?/id/[A-Za-z0-9]+
  Namespace:
    Type: String
    Description: Kubernetes namespace used by the Helm releases.
    AllowedPattern: '[a-z0-9]([-a-z0-9]*[a-z0-9])?'
    Default: default
  PermissionsBoundaryArn:
    Type: String
    Description: Optional existing IAM permissions boundary ARN.
    AllowedPattern: ^$|arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+
    Default: ''
  ServiceAccount:
    Type: String
    Description: Must match the rendered Kubernetes ServiceAccount name.
    AllowedPattern: '[a-z0-9]([-a-z0-9.]*[a-z0-9])?'
    Default: external-secrets
  SecretPrefix:
    Type: String
    Description: Existing Secrets Manager prefix. No leading/trailing slash or IAM wildcards.
    AllowedPattern: '[A-Za-z0-9_-]+(?:/[A-Za-z0-9_.-]+)*'
  SecretRegion:
    Type: String
    Description: Region containing Secrets Manager objects.
    AllowedPattern: '[a-z]{2}(-[a-z]+)+-[0-9]+'
  SecretEncryptionKeyArn:
    Type: String
    Description: Optional customer-managed symmetric key used to encrypt Secrets under SecretPrefix in SecretRegion.
    AllowedPattern: ^$|arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+
    Default: ''
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
Resources:
  ReaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub: |-
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${OidcIssuer}"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "${OidcIssuer}:aud": "sts.amazonaws.com",
                    "${OidcIssuer}:sub": "system:serviceaccount:${Namespace}:${ServiceAccount}"
                  }
                }
              }
            ]
          }
      PermissionsBoundary:
        Fn::If:
        - HasBoundary
        - Ref: PermissionsBoundaryArn
        - Ref: AWS::NoValue
      Policies:
      - PolicyName: workload-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${SecretRegion}:${AWS::AccountId}:secret:${SecretPrefix}/*
          - Fn::If:
            - HasEncryptionKey
            - Effect: Allow
              Action: kms:Decrypt
              Resource:
                Ref: SecretEncryptionKeyArn
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: secretsmanager.${SecretRegion}.${AWS::URLSuffix}
                StringLike:
                  kms:EncryptionContext:SecretARN:
                    Fn::Sub: arn:${AWS::Partition}:secretsmanager:${SecretRegion}:${AWS::AccountId}:secret:${SecretPrefix}/*
            - Ref: AWS::NoValue
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: reader-role
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-ReaderRole
      Description:
        Fn::Sub: DogeOS ${ResourceClassification} - ${Environment} - ReaderRole. Nonproduction resources may be
          deleted after testing.
Outputs:
  RoleArn:
    Description: Bind to the External Secrets ServiceAccount used by these SecretStores.
    Value:
      Fn::GetAtt:
      - ReaderRole
      - Arn
Conditions:
  HasBoundary:
    Fn::Not:
    - Fn::Equals:
      - Ref: PermissionsBoundaryArn
      - ''
  HasEncryptionKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: SecretEncryptionKeyArn
      - ''

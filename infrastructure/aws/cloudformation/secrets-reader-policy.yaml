AWSTemplateFormatVersion: '2010-09-09'
Description: Add deployment-scoped read access to an existing ESO role. Does not revoke existing grants; remove broad permissions through their owner.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  SecretPrefix:
    Type: String
    Description: Existing Secrets Manager prefix. No leading/trailing slash or IAM wildcards.
    AllowedPattern: '[A-Za-z0-9_-]+(?:/[A-Za-z0-9_.-]+)*'
  SecretRegion:
    Type: String
    Description: Region containing Secrets Manager objects.
    AllowedPattern: '[a-z]{2}(-[a-z]+)+-[0-9]+'
  AdditionalSecretArns:
    Type: String
    Default: ''
    Description: Optional comma-separated full Secret ARNs outside SecretPrefix, including their six-character suffixes. No spaces or wildcards.
    AllowedPattern: '^$|arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}(,arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6})*'
  SecretEncryptionKeyArn:
    Type: String
    Description: Optional customer-managed symmetric key shared by the selected Secrets. Other encryption keys require separate reviewed grants.
    AllowedPattern: ^$|arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+
    Default: ''
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
  ExistingRoleName:
    Type: String
    Description: Existing ESO role name. Its trust and other grants are unchanged; adding this policy alone cannot restrict a broader policy.
    AllowedPattern: '[A-Za-z0-9+=,.@_-]{1,64}'
Resources:
  ReaderPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description:
        Fn::Sub: DogeOS ${Environment} ${ResourceClassification} Secret reader grant
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          - secretsmanager:DescribeSecret
          Resource:
            Fn::Sub: arn:${AWS::Partition}:secretsmanager:${SecretRegion}:${AWS::AccountId}:secret:${SecretPrefix}/*
        - Fn::If:
          - HasEncryptionKey
          - Effect: Allow
            Action: kms:Decrypt
            Resource:
              Ref: SecretEncryptionKeyArn
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: secretsmanager.${SecretRegion}.${AWS::URLSuffix}
              StringLike:
                kms:EncryptionContext:SecretARN:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${SecretRegion}:${AWS::AccountId}:secret:${SecretPrefix}/*
          - Ref: AWS::NoValue
        - Fn::If:
          - HasAdditionalSecrets
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
            Resource:
              Fn::Split:
              - ','
              - Ref: AdditionalSecretArns
          - Ref: AWS::NoValue
        - Fn::If:
          - HasAdditionalSecretsEncryptionKey
          - Effect: Allow
            Action: kms:Decrypt
            Resource:
              Ref: SecretEncryptionKeyArn
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: secretsmanager.${SecretRegion}.${AWS::URLSuffix}
                kms:EncryptionContext:SecretARN:
                  Fn::Split:
                  - ','
                  - Ref: AdditionalSecretArns
          - Ref: AWS::NoValue
      Roles:
      - Ref: ExistingRoleName
Conditions:
  HasAdditionalSecrets:
    Fn::Not:
    - Fn::Equals:
      - Ref: AdditionalSecretArns
      - ''
  HasAdditionalSecretsEncryptionKey:
    Fn::And:
    - Fn::Not:
      - Fn::Equals:
        - Ref: AdditionalSecretArns
        - ''
    - Fn::Not:
      - Fn::Equals:
        - Ref: SecretEncryptionKeyArn
        - ''
  HasEncryptionKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: SecretEncryptionKeyArn
      - ''
Outputs:
  PolicyArn:
    Value:
      Ref: ReaderPolicy

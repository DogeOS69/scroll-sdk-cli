AWSTemplateFormatVersion: '2010-09-09'
Description: External proof credential destination. Initialize its two credentials with initialize-proof-secret.py.
Parameters:
  Environment:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
  SecretName:
    Type: String
    AllowedPattern: '[A-Za-z0-9/_+=.@-]+'
    Description: Use the environment Secret prefix and set preparation.proofAws.secretName to this name.
Resources:
  ProofSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name:
        Ref: SecretName
      Description:
        Fn::Sub: DogeOS ${ResourceClassification} - ${Environment} proof credentials. Nonproduction resources may
          be deleted after testing.
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Purpose
        Value: proof-credentials
Outputs:
  SecretArn:
    Value:
      Ref: ProofSecret
  SecretName:
    Value:
      Ref: SecretName

AWSTemplateFormatVersion: '2010-09-09'
Description: Additional host/path route to an existing target group; creates no load balancer or target group.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  ListenerArn:
    Type: String
    Description: Existing HTTPS443 ALB listener ARN.
    AllowedPattern: arn:aws[a-z-]*:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:listener/app/[A-Za-z0-9-]+/[a-f0-9]+/[a-f0-9]+
  Hostname:
    Type: String
    Description: Exact hostname covered by the ALB certificate.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  PathPatterns:
    Type: CommaDelimitedList
    Default: /*
    Description: Generic routes only; 1-3 ALB path patterns matching the rendered ingress.
  ListenerPriority:
    Type: Number
    MinValue: 1
    MaxValue: 50000
    Description: Unique on this listener. Narrow routes must precede broader overlapping routes.
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
  TargetGroupArn:
    Type: String
    AllowedPattern: arn:aws[a-z-]*:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/[A-Za-z0-9-]+/[a-f0-9]+
Resources:
  Route:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: ListenerArn
      Priority:
        Ref: ListenerPriority
      Conditions:
      - Field: host-header
        HostHeaderConfig:
          Values:
          - Ref: Hostname
      - Field: path-pattern
        PathPatternConfig:
          Values:
            Ref: PathPatterns
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: TargetGroupArn
Outputs:
  Lifecycle:
    Value:
      Fn::Sub: '${Environment}: ${ResourceClassification}'

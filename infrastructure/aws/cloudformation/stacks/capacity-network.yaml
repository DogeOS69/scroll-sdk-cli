  ControllerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: HttpsVpcId
      Protocol: HTTP
      Port:
        Ref: ControllerBackendPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath:
        Ref: ControllerHealthCheckPath
      Matcher:
        HttpCode:

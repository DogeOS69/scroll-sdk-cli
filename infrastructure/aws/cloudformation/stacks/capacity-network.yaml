AWSTemplateFormatVersion: '2010-09-09'
Description: DogeOS capacity-network lifecycle stack. Generated by assemble-stacks.py; review before applying.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  HttpsVpcId:
    Type: AWS::EC2::VPC::Id
  HttpsSubnetA:
    Type: AWS::EC2::Subnet::Id
  HttpsSubnetB:
    Type: AWS::EC2::Subnet::Id
  HttpsSubnetC:
    Type: String
    Default: ''
    AllowedPattern: ^$|subnet-(?:[0-9a-f]{8}|[0-9a-f]{17})
    Description: Optional third AZ subnet. Enable every AZ that can host backend Pods.
  HttpsScheme:
    Type: String
    Description: Use internal for dstack.
    AllowedValues:
    - internal
    Default: internal
  HttpsCertificateArn:
    Type: String
    Description: Issued ACM certificate covering all routed hosts, in this account/region.
    AllowedPattern: arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+
  HttpsClientIpv4Cidr:
    Type: String
    Description: Explicit allowed HTTPS client range; empty keeps the endpoint closed.
    AllowedPattern: ^$|(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])
    Default: ''
  HttpsBackendIpv4Cidr:
    Type: String
    Description: VPC/Pod IPv4 range reachable by this ALB.
    AllowedPattern: (?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])
  HttpsBackendPortFrom:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Lowest approved backend/health-check port.
  HttpsBackendPortTo:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Highest approved backend/health-check port.
  HttpsPrivateHostname:
    Type: String
    Description: Optional exact-host private Route53 zone for internal dstack only. Empty creates no DNS.
    AllowedPattern: ^$|[a-z0-9][a-z0-9.-]+\.[a-z]{2,}
    Default: ''
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
  ControllerHostname:
    Type: String
    Description: Exact hostname covered by the ALB certificate.
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  ControllerServiceKind:
    Type: String
    Description: tso uses only /health, /signer and /signer/*. generic uses PathPatterns.
    AllowedValues:
    - tso
    - generic
    Default: tso
  ControllerPathPatterns:
    Type: CommaDelimitedList
    Default: /*
    Description: Generic routes only; 1-3 ALB path patterns matching the rendered ingress.
  ControllerListenerPriority:
    Type: Number
    MinValue: 1
    MaxValue: 50000
    Description: Unique on this listener. Narrow routes must precede broader overlapping routes.
  ControllerBackendPort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
  ControllerHealthCheckPath:
    Type: String
    Description: Must match the rendered application values.
    AllowedPattern: /.*
    Default: /health
  ControllerHealthSuccessCodes:
    Type: String
    Description: Must match the rendered application ALB success-codes.
    AllowedPattern: '[0-9,-]+'
    Default: '200'
Resources:
  HttpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: Https
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-Https-SecurityGroup
      GroupDescription:
        Fn::Sub: DogeOS ${ResourceClassification} ${Environment} HTTPS edge
      VpcId:
        Ref: HttpsVpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort:
          Ref: HttpsBackendPortFrom
        ToPort:
          Ref: HttpsBackendPortTo
        CidrIp:
          Ref: HttpsBackendIpv4Cidr
        Description:
          Fn::Sub: ${Environment} ${ResourceClassification} backend traffic
  HttpsClientIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HttpsHasClient
    Properties:
      GroupId:
        Ref: HttpsSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp:
        Ref: HttpsClientIpv4Cidr
      Description:
        Fn::Sub: ${Environment} ${ResourceClassification} client ingress
  HttpsLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme:
        Ref: HttpsScheme
      IpAddressType: ipv4
      Subnets:
      - Ref: HttpsSubnetA
      - Ref: HttpsSubnetB
      - Fn::If:
        - HttpsHasSubnetC
        - Ref: HttpsSubnetC
        - Ref: AWS::NoValue
      SecurityGroups:
      - Ref: HttpsSecurityGroup
      LoadBalancerAttributes:
      - Key: idle_timeout.timeout_seconds
        Value: '120'
      - Key: deletion_protection.enabled
        Value: 'true'
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: Https
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-Https-LoadBalancer
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: HttpsLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
      - CertificateArn:
          Ref: HttpsCertificateArn
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '404'
          ContentType: text/plain
          MessageBody: Not found
  HttpsPrivateZone:
    Type: AWS::Route53::HostedZone
    Condition: HttpsHasPrivateDns
    Properties:
      Name:
        Ref: HttpsPrivateHostname
      VPCs:
      - VPCId:

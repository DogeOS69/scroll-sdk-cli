      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: Controller
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-Controller-TargetGroup
  ControllerRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: HttpsListener
      Priority:
        Ref: ControllerListenerPriority
      Conditions:
      - Field: host-header
        HostHeaderConfig:
          Values:
          - Ref: ControllerHostname
      - Field: path-pattern
        PathPatternConfig:
          Values:
            Fn::If:
            - ControllerIsTso
            - - /health
              - /signer
              - /signer/*
            - Ref: ControllerPathPatterns
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: ControllerTargetGroup
Outputs:
  HttpsPrivateUrl:
    Condition: HttpsHasPrivateDns
    Description: Certificate hostname for the private controller endpoint; never substitute the ALB DNS name.
    Value:
      Fn::Sub: https://${HttpsPrivateHostname}
  HttpsLoadBalancerArn:
    Description: Existing-ALB endpoint ARN.
    Value:
      Ref: HttpsLoadBalancer
  HttpsListenerArn:
    Description: Supply to http-target.yaml.
    Value:
      Ref: HttpsListener
  HttpsSecurityGroupId:
    Description: Allow this SG to reach the backends; keep Kubernetes NetworkPolicy aligned.
    Value:
      Ref: HttpsSecurityGroup
  HttpsDnsName:
    Description: Public DNS remains externally managed.
    Value:
      Fn::GetAtt:
      - HttpsLoadBalancer
      - DNSName
  HttpsCanonicalHostedZoneId:
    Description: Alias target zone ID, not your application hosted zone.
    Value:
      Fn::GetAtt:
      - HttpsLoadBalancer
      - CanonicalHostedZoneID
  ControllerTargetGroupArn:
    Description: Bind exactly one Kubernetes Service through TargetGroupBinding.
    Value:
      Ref: ControllerTargetGroup
Conditions:
  HttpsHasSubnetC:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpsSubnetC
      - ''
  HttpsHasClient:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpsClientIpv4Cidr
      - ''
  HttpsHasPrivateDns:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpsPrivateHostname
      - ''
  ControllerIsTso:
    Fn::Equals:
    - Ref: ControllerServiceKind
    - tso
Rules:
  HttpsDistinctThirdSubnet:
    Assertions:
    - Assert:
        Fn::And:
        - Fn::Not:
          - Fn::Equals:
            - Ref: HttpsSubnetC
            - Ref: HttpsSubnetA
        - Fn::Not:
          - Fn::Equals:
            - Ref: HttpsSubnetC
            - Ref: HttpsSubnetB
      AssertDescription: Optional third subnet must differ from SubnetA and SubnetB.
  HttpsPrivateDnsOnly:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::Equals:
          - Ref: HttpsPrivateHostname
          - ''
        - Fn::Equals:
          - Ref: HttpsScheme
          - internal
      AssertDescription: PrivateHostname requires internal scheme.
  HttpsDistinctSubnets:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: HttpsSubnetA
          - Ref: HttpsSubnetB
      AssertDescription: Select two distinct subnets in different AZs.

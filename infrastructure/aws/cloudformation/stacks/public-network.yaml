        AllocationId:
          Ref: BootnodeEipAllocationA
      - SubnetId:
          Ref: BootnodeSubnetB
        AllocationId:
          Ref: BootnodeEipAllocationB
      LoadBalancerAttributes:
      - Key: load_balancing.cross_zone.enabled

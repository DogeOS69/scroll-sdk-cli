Outputs:
  HttpsPrivateUrl:
    Condition: HttpsHasPrivateDns
    Description: Certificate hostname for the private controller endpoint; never substitute the ALB DNS name.
    Value:
      Fn::Sub: https://${HttpsPrivateHostname}
  HttpsLoadBalancerArn:
    Description: Existing-ALB endpoint ARN.
    Value:
      Ref: HttpsLoadBalancer
  HttpsListenerArn:
    Description: Supply to http-target.yaml.
    Value:
      Ref: HttpsListener
  HttpsSecurityGroupId:
    Description: Allow this SG to reach the backends; keep Kubernetes NetworkPolicy aligned.
    Value:
      Ref: HttpsSecurityGroup
  HttpsDnsName:
    Description: Public DNS remains externally managed.
    Value:
      Fn::GetAtt:
      - HttpsLoadBalancer
      - DNSName
  HttpsCanonicalHostedZoneId:
    Description: Alias target zone ID, not your application hosted zone.
    Value:
      Fn::GetAtt:
      - HttpsLoadBalancer
      - CanonicalHostedZoneID
  BootnodeLoadBalancerArn:
    Description: One bootnode per NLB.
    Value:
      Ref: BootnodeLoadBalancer
  BootnodeTargetGroupArn:
    Description: bootnodePublicP2p[].existingNlb.targetGroupArn.
    Value:
      Ref: BootnodeTargetGroup
  BootnodeSecurityGroupId:
    Description: bootnodePublicP2p[].existingNlb.securityGroupIds entry.
    Value:
      Ref: BootnodeSecurityGroup
  BootnodeListenerArn:
    Description: TCP30303 listener for read-only validation.
    Value:
      Ref: BootnodeListener
  BootnodeDnsName:
    Description: NLB DNS name; public P2P endpoints use the allocated EIP addresses.
    Value:
      Fn::GetAtt:
      - BootnodeLoadBalancer
      - DNSName
Conditions:
  HttpsHasSubnetC:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpsSubnetC
      - ''
  HttpsHasClient:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpsClientIpv4Cidr
      - ''
  HttpsHasPrivateDns:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpsPrivateHostname
      - ''
  BootnodeHasPeer:
    Fn::Not:
    - Fn::Equals:
      - Ref: BootnodePeerIpv4Cidr
      - ''
Rules:
  HttpsDistinctThirdSubnet:
    Assertions:
    - Assert:
        Fn::And:
        - Fn::Not:
          - Fn::Equals:
            - Ref: HttpsSubnetC
            - Ref: HttpsSubnetA
        - Fn::Not:
          - Fn::Equals:
            - Ref: HttpsSubnetC
            - Ref: HttpsSubnetB
      AssertDescription: Optional third subnet must differ from SubnetA and SubnetB.
  HttpsPrivateDnsOnly:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::Equals:
          - Ref: HttpsPrivateHostname
          - ''
        - Fn::Equals:
          - Ref: HttpsScheme
          - internal
      AssertDescription: PrivateHostname requires internal scheme.
  HttpsDistinctSubnets:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: HttpsSubnetA
          - Ref: HttpsSubnetB
      AssertDescription: Select two distinct subnets in different AZs.
  BootnodeDistinctPlacement:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: BootnodeSubnetA
          - Ref: BootnodeSubnetB
      AssertDescription: Select distinct subnets in different AZs.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: BootnodeEipAllocationA
          - Ref: BootnodeEipAllocationB
      AssertDescription: Select distinct existing EIP allocations.

          Fn::Sub: ${Environment}-Https-SecurityGroup
      GroupDescription:
        Fn::Sub: DogeOS ${ResourceClassification} ${Environment} HTTPS edge
      VpcId:
        Ref: HttpsVpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort:
          Ref: HttpsBackendPortFrom
        ToPort:
          Ref: HttpsBackendPortTo
        CidrIp:
          Ref: HttpsBackendIpv4Cidr
        Description:
          Fn::Sub: ${Environment} ${ResourceClassification} backend traffic
  HttpsClientIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HttpsHasClient
    Properties:
      GroupId:
        Ref: HttpsSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp:
        Ref: HttpsClientIpv4Cidr
      Description:
        Fn::Sub: ${Environment} ${ResourceClassification} client ingress
  HttpsLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme:
        Ref: HttpsScheme
      IpAddressType: ipv4
      Subnets:
      - Ref: HttpsSubnetA

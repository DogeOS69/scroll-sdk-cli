  HttpsBackendPortTo:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Highest approved backend/health-check port.
  HttpsPrivateHostname:
    Type: String
    Description: Optional exact-host private Route53 zone for internal dstack only. Empty creates no DNS.
    AllowedPattern: ^$|[a-z0-9][a-z0-9.-]+\.[a-z]{2,}
    Default: ''
  ResourceClassification:
    Type: String
    Default: production
    AllowedValues:
    - production
    - nonproduction-deletable
    Description: Resource lifecycle. nonproduction-deletable explicitly marks disposable test infrastructure.
  BootnodeSubnetA:
    Type: AWS::EC2::Subnet::Id
  BootnodeSubnetB:
    Type: AWS::EC2::Subnet::Id
  BootnodeEipAllocationA:
    Type: String
    Description: Existing unused EIP allocation in this region.
    AllowedPattern: eipalloc-[a-f0-9]+
  BootnodeEipAllocationB:
    Type: String
    Description: Second existing unused EIP allocation.
    AllowedPattern: eipalloc-[a-f0-9]+
  BootnodePeerIpv4Cidr:
    Type: String
    Description: Approved peer range. Empty keeps the endpoint closed.
    AllowedPattern: ^$|(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[1-9]|[12][0-9]|3[0-2])
    Default: ''
  BootnodeBackendIpv4Cidr:
    Type: String
    Description: VPC/Pod IPv4 range containing the designated bootnode.
    AllowedPattern: (?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])
Resources:
  HttpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags:
      - Key: ManagedBy
        Value: dogeos-cloudformation
      - Key: Environment
        Value:
          Ref: Environment
      - Key: Purpose
        Value: Https
      - Key: ResourceClassification
        Value:
          Ref: ResourceClassification
      - Key: Name

AWSTemplateFormatVersion: '2010-09-09'
Description: DogeOS public-network lifecycle stack. Generated by assemble-stacks.py; review before applying.
Parameters:
  Environment:
    Type: String
    Description: Stable infrastructure environment; do not use a deployment date.
    AllowedPattern: '[a-z][a-z0-9-]{2,47}'
  HttpsVpcId:

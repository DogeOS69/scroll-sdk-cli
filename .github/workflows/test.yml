name: tests
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn
      - run: yarn build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native dstack worker models and lifecycle offline
        run: |
          python -m pip install 'dstack==0.21.5'
          python scripts/test-proof-workers-controller.py
      - run: yarn test
